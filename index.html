<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>道路人格測驗</title>
<meta name="description" content="十二題測出你的道路人格：步行、單車、共享運具、機車、汽車、大眾運輸。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Chivo+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" />

<style>
  :root {
    --ground: #e9e7e0;
    --surface: #f4f2ec;
    --surface-2: #fdfdfb;
    --ink: #232227;
    --ink-soft: #5b5952;
    --ink-faint: #908d84;
    --line: #d2cfc4;
    --asphalt: #2b2a2f;
    --signal: #0f7c60;
    --signal-tint: #0f7c601a;
    --signal-ink: #0b5c47;
    --marking: #e0a91f;
    --danger: #b04a3f;

    --hue-walk: #0f7c60;
    --hue-bike: #1f6f83;
    --hue-share: #a4692f;
    --hue-moto: #b0473d;
    --hue-car: #474b6b;
    --hue-transit: #2f6a41;

    --font-display: "Chivo", "Noto Sans TC", system-ui, sans-serif;
    --font-body: "Noto Sans TC", "Chivo", system-ui, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", monospace;

    --r: 4px;
    --pad: clamp(18px, 5vw, 26px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #161619;
      --surface: #202024;
      --surface-2: #26262c;
      --ink: #e9e7e1;
      --ink-soft: #a9a69d;
      --ink-faint: #75726b;
      --line: #35353c;
      --asphalt: #0d0d0f;
      --signal: #34b58c;
      --signal-tint: #34b58c1f;
      --signal-ink: #82d9be;
      --marking: #e6b53c;
      --danger: #d9756a;

      --hue-walk: #34b58c;
      --hue-bike: #56b4c9;
      --hue-share: #d69857;
      --hue-moto: #dd7d73;
      --hue-car: #8f93b8;
      --hue-transit: #62b47a;
    }
  }

  :root[data-theme="dark"] {
    --ground: #161619;
    --surface: #202024;
    --surface-2: #26262c;
    --ink: #e9e7e1;
    --ink-soft: #a9a69d;
    --ink-faint: #75726b;
    --line: #35353c;
    --asphalt: #0d0d0f;
    --signal: #34b58c;
    --signal-tint: #34b58c1f;
    --signal-ink: #82d9be;
    --marking: #e6b53c;
    --danger: #d9756a;

    --hue-walk: #34b58c;
    --hue-bike: #56b4c9;
    --hue-share: #d69857;
    --hue-moto: #dd7d73;
    --hue-car: #8f93b8;
    --hue-transit: #62b47a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 468px;
    margin: auto;
    padding: clamp(20px, 6vw, 40px) clamp(14px, 4vw, 20px) clamp(28px, 8vw, 56px);
  }

  /* ---------- masthead ---------- */
  .mast {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .mast .tag {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .mast .tag b { color: var(--signal-ink); font-weight: 700; }

  /* ---------- road progress ---------- */
  .road {
    position: relative;
    height: 12px;
    border-radius: 6px;
    background: var(--asphalt);
    overflow: hidden;
    margin-bottom: 26px;
  }
  .road::after {
    content: "";
    position: absolute;
    inset: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(
      to right,
      var(--marking) 0 12px,
      transparent 12px 24px
    );
    opacity: 0.9;
  }
  .road-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: var(--signal);
    transition: width 420ms cubic-bezier(0.4, 0, 0.1, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .road-fill { transition: none; }
  }

  /* ---------- generic ---------- */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(30px, 9vw, 40px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 14px;
  }
  .lede {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 22px;
  }

  .btn {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    color: var(--surface-2);
    background: var(--signal);
    border: none;
    border-radius: var(--r);
    padding: 15px 20px;
    width: 100%;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 120ms ease, filter 120ms ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--line);
  }
  .btn.ghost:hover { border-color: var(--signal); color: var(--signal-ink); filter: none; }

  :focus-visible {
    outline: 2.5px solid var(--signal);
    outline-offset: 2px;
  }

  /* ---------- start: mode strip (decorative) ---------- */
  .strip {
    display: flex;
    gap: 10px;
    margin: 2px 0 26px;
    padding: 16px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r);
    color: var(--ink-faint);
  }
  .strip .badge { width: 34px; height: 34px; flex: 1 1 0; }

  .badge {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: none;
    border-radius: 999px;
    border: 1.5px solid currentColor;
  }
  .badge svg { width: 60%; height: 60%; }

  /* ---------- question ---------- */
  .qhead {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .qcount {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
  }
  .qtext {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(19px, 5.4vw, 23px);
    line-height: 1.34;
    text-wrap: balance;
    margin: 6px 0 20px;
  }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: var(--r);
    padding: 13px 15px;
    min-height: 58px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
  }
  .opt:hover { border-color: var(--signal); background: var(--signal-tint); }
  .opt:active { transform: translateY(1px); }
  .opt .badge {
    width: 32px; height: 32px;
    color: var(--ink-faint);
    transition: color 120ms ease;
  }
  .opt:hover .badge { color: var(--signal); }
  .opt.pick {
    border-color: var(--signal);
    background: var(--signal);
    color: var(--surface-2);
  }
  .opt.pick .badge { color: var(--surface-2); }

  .qnav {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 24px;
  }
  .back {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px 2px;
  }
  .back:hover { color: var(--ink); }
  .back[hidden] { display: none; }

  /* ---------- result plate ---------- */
  .plate {
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-top: 5px solid var(--hue, var(--signal));
    border-radius: var(--r);
    padding: var(--pad);
  }
  .plate .badge {
    width: 52px; height: 52px;
    color: var(--hue, var(--signal));
    margin-bottom: 14px;
  }
  .rname {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(26px, 7.5vw, 33px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  .nick {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 18px;
  }
  .motto {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    border-left: 3px solid var(--marking);
    padding-left: 14px;
    margin: 0 0 16px;
  }
  .desc { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 18px; }

  .rule {
    border: none;
    border-top: 1.5px dashed var(--line);
    margin: 18px 0;
  }

  .shadow-lbl, .idx-lbl {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px;
  }
  .shadow-txt { color: var(--ink-soft); font-size: 14px; margin: 0 0 18px; }

  .studs { display: flex; align-items: center; gap: 7px; }
  .stud {
    width: 15px; height: 15px;
    border-radius: 999px;
    border: 1.5px solid var(--hue, var(--signal));
  }
  .stud.on { background: var(--hue, var(--signal)); }
  .studs span {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    margin-left: 4px;
  }

  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }
  .pair div {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r);
    padding: 12px 13px;
  }
  .pair .k {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 4px;
  }
  .pair .v { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
  .pair .match .v { color: var(--signal-ink); }
  .pair .clash .v { color: var(--danger); }

  /* ---------- club cta ---------- */
  .cta {
    margin-top: 16px;
    background: var(--surface);
    border: 1.5px dashed var(--line);
    border-radius: var(--r);
    padding: var(--pad);
  }
  .cta p { margin: 0 0 12px; font-size: 14px; color: var(--ink-soft); }
  .cta .club {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .cta .where {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }
  .qr {
    display: grid;
    place-items: center;
    text-align: center;
    height: 116px;
    border: 1.5px dashed var(--line);
    border-radius: var(--r);
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    line-height: 1.7;
  }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .toast {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--signal-ink);
    min-height: 18px;
    margin-top: 10px;
  }

  .foot {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 28px;
  }

  /* ---------- view transitions ---------- */
  .view { animation: rise 260ms cubic-bezier(0.3, 0, 0.15, 1); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .view { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="mast">
    <span class="tag">道路人格 · <b>人本交通</b></span>
    <span class="tag" id="progLabel">START</span>
  </div>
  <div class="road" aria-hidden="true"><div class="road-fill" id="roadFill"></div></div>

  <main id="stage" aria-live="polite"></main>

  <p class="foot">純前端測驗 · 結果不會上傳任何伺服器</p>
</div>

<script>
  /* ---------------- mode glyphs ---------------- */
  const GLYPH = {
    walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.3" r="1.9"/><path d="M12.6 6.4 10 11.6l3 2.2 1 6.1"/><path d="M10 11.6 6.4 12.9"/><path d="M13.2 13.9 10.7 17l-3.1 1.1"/><path d="M15.2 10.7 17.3 12.9l2.3 .5"/></svg>',
    bike: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16.5" r="3.6"/><circle cx="18" cy="16.5" r="3.6"/><path d="M6 16.5 10.5 9H15"/><path d="m10.5 9-1.6-3H6.6"/><path d="M14.4 9.4 18 16.5"/><circle cx="12.3" cy="5.4" r="1"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10a7.5 7.5 0 0 1 12.4-3.2L19.5 9"/><path d="M19.5 4v5h-5"/><path d="M19.5 14a7.5 7.5 0 0 1-12.4 3.2L4.5 15"/><path d="M4.5 20v-5h5"/></svg>',
    moto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="2.9"/><circle cx="18.5" cy="17" r="2.9"/><path d="M5.5 17h7l3.2-6.2H19"/><path d="M15.7 10.8 13.9 7h-3.2"/><path d="M9 11h4.3"/><path d="M18.5 17c.2-3.8-1.8-6-4-6"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.2 5 8.2A3 3 0 0 1 7.8 6.3h8.4A3 3 0 0 1 19 8.2l2 5"/><path d="M3 13.2h18v3.6a1 1 0 0 1-1 1h-1.5"/><path d="M6.5 17.8H4a1 1 0 0 1-1-1v-3.6"/><circle cx="7.6" cy="17.6" r="1.7"/><circle cx="16.4" cy="17.6" r="1.7"/></svg>',
    transit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="4" width="17.6" height="13" rx="2.2"/><path d="M3.2 10.5h17.6"/><path d="M9 4v6.5M15 4v6.5"/><circle cx="7.6" cy="19.4" r="1.4"/><circle cx="16.4" cy="19.4" r="1.4"/></svg>'
  };

  /* ---------------- personas ---------------- */
  const P = {
    walk: {
      name: "步行者", tab: "散步派",
      nick: "用雙腳丈量城市的人",
      motto: "「能走到的地方，都不算遠。」",
      desc: "你相信好城市是走出來的。紅綠燈秒數、騎樓平不平、有沒有樹蔭，你比誰都敏感；移動對你不只是位移，而是逛、是看、是生活本身。",
      shadow: "距離一超過兩公里就開始跟自己談判，而且最恨人行道被停滿機車。",
      idx: 5, match: "transit", clash: "car"
    },
    bike: {
      name: "單車騎士", tab: "踏板派",
      nick: "城市裡的一陣風",
      motto: "「紅燈是拿來熱身的。」",
      desc: "你找到了速度與自由的甜蜜點——不塞車、停在門口、順便運動。你記得城裡每一段連續的自行車道，也記得它們每一次莫名其妙的中斷。",
      shadow: "一下雨人生就暫停，遇到長爬坡會默默懷疑當初的選擇。",
      idx: 4, match: "share", clash: "moto"
    },
    share: {
      name: "共享游牧民", tab: "訂閱派",
      nick: "不被一台車綁住的人",
      motto: "「我不買車，我挑當下最順的那一種。」",
      desc: "短程平路掃共享單車，要跨區換共享機車，下雨或載東西再叫共享汽車——它們是不同的工具，你只是剛好都會用。你要的是「需要時就有、用完就走」，養一台車對你來說是負擔，不是資產。",
      shadow: "尖峰時段開圖一片全紅會焦慮；每次出門都得重新決定一次用什麼，其實也是一種累。",
      idx: 4, match: "transit", clash: "car"
    },
    moto: {
      name: "機車騎士", tab: "鑽縫派",
      nick: "巷弄裡的游擊隊",
      motto: "「機車一發，全台都是我家巷口。」",
      desc: "你追求極致的機動性——門到門、鑽得過、停得下、油錢便宜。台灣的街道幾乎是為你設計的，你也把它用好用滿。",
      shadow: "停車格永遠不夠，被違停逼上人行道時其實也很掙扎；夏天曬、冬天冷、雨天狼狽。",
      idx: 2, match: "share", clash: "walk"
    },
    car: {
      name: "汽車駕駛", tab: "城堡派",
      nick: "一個會移動的房間",
      motto: "「我的車就是我的城堡。」",
      desc: "你要的是掌控與舒適——恆溫、隱私、後車廂萬用、颱風天照樣出門。一趟門到門、不看天氣也不看時刻表臉色，對你來說值回票價。",
      shadow: "找車位可以繞十分鐘，油錢和停車費是看不見的開銷；塞在車陣裡看單車呼嘯而過時，心裡會有一點點動搖。",
      idx: 1, match: "transit", clash: "walk"
    },
    transit: {
      name: "大眾運輸信徒", tab: "路網派",
      nick: "把整張路網背起來的人",
      motto: "「刷卡進站，人生自動導航。」",
      desc: "捷運、公車、火車，你熟悉轉乘、算得準離峰、月票一定回本。通勤時間你拿來睡覺、追劇、發呆，把「開車的專注」還給城市。",
      shadow: "有末班車焦慮症，遇到誤點或跳站會當場血壓上升。",
      idx: 5, match: "walk", clash: "car"
    }
  };
  const LABEL = { walk: "步行", bike: "單車", share: "共享", moto: "機車", car: "汽車", transit: "大眾運輸" };
  const PRIORITY = ["walk", "transit", "bike", "share", "moto", "car"];

  /* ---------------- questions ----------------
     每個情境都寫清楚人事時地、每個動詞都補上客體；
     人格由多題加成慢慢累積，單一答案不會直接決定結果。 */
  const Q = [
    {
      q: "你和朋友約在一個大家都沒去過、離你家大約 10 公里的地方。出發前你會先做什麼？",
      a: [
        ["打開地圖，把開車路線和目的地附近的停車場查清楚", { car: 2, moto: 1 }],
        ["查捷運或公車要怎麼轉、大概幾點能到", { transit: 2, share: 1 }],
        ["大致記住方向就出發，路上再看路標和手機地圖修正", { bike: 2, walk: 1 }],
        ["比較開車、大眾運輸、騎車各要多少時間和錢，再挑一種", { share: 2, transit: 1 }],
        ["提議把地點改到雙方都方便、不用跑這麼遠的地方", { walk: 2, transit: 1 }]
      ]
    },
    {
      q: "上下班尖峰時間，下面哪一種情況你最能接受？",
      a: [
        ["有位子坐、能滑手機放空，就算多花十幾分鐘也沒關係", { transit: 2, car: 1 }],
        ["只要能一直往前、不必停下來，稍微擠、稍微曬都可以忍", { moto: 2, bike: 1 }],
        ["寧願自己踩腳踏車流一身汗，也不要被卡住或被人推擠", { bike: 2, walk: 1 }],
        ["乾脆錯開尖峰，提早或延後出門，不跟大家擠", { walk: 2, transit: 1 }],
        ["待在自己車裡吹冷氣，塞車就塞車，至少空間是自己的", { car: 2, moto: 1 }],
        ["看當天路況，臨時決定改用哪一種交通工具繞過去", { share: 2, transit: 1 }]
      ]
    },
    {
      q: "突然下大雨，你臨時要出門大約 3 公里，你會怎麼做？",
      a: [
        ["開自己的汽車去，反正淋不到雨", { car: 2, transit: 1 }],
        ["穿好雨衣，騎機車出門", { moto: 2, bike: 1 }],
        ["叫一台計程車，讓司機來載", { share: 2, car: 1 }],
        ["撐傘直接走過去，3 公里淋一下還好", { walk: 2, bike: 1 }],
        ["改搭捷運或公車，寧可繞遠一點也不要淋雨", { transit: 2, walk: 1 }]
      ]
    },
    {
      q: "有一筆大約五千元的意外之財，規定只能花在「讓你每天通勤更舒服」的東西上，你會拿去做什麼？",
      a: [
        ["幫汽車裝一台行車記錄器，再加一組頸枕和遮陽簾", { car: 3 }],
        ["換一頂好一點的安全帽，加一套耐穿的雨衣雨褲", { moto: 2, bike: 1 }],
        ["一次儲值幾個月份的定期票或電子票證（像 TPASS）", { transit: 3 }],
        ["買一雙好走的鞋，加一個輕便耐背的後背包", { walk: 3 }],
        ["儲值到叫車和共享運具 App 裡，需要時隨時能用", { share: 3 }],
        ["把腳踏車的座墊、輪胎和車燈全部換新升級", { bike: 3 }]
      ]
    },
    {
      q: "朋友臨時揪吃飯，餐廳要轉兩班車、車程一小時才會到。你會怎麼反應？",
      a: [
        ["有點懶，乾脆自己騎機車直接騎過去", { moto: 2, car: 1 }],
        ["可以啊，這一小時剛好在車上補眠或追劇", { transit: 2 }],
        ["我開汽車去，還能順路載其他幾個朋友", { car: 2 }],
        ["先查清楚每一段車怎麼銜接、末班車幾點開", { transit: 2, share: 1 }],
        ["看能不能先騎腳踏車騎一半，再轉搭捷運或公車", { bike: 2, share: 1 }],
        ["出發前不多想，到現場再決定回程搭哪一種交通工具", { share: 2, moto: 1 }]
      ]
    },
    {
      q: "你家樓下如果只能多加一樣東西，你最想要哪一個？",
      a: [
        ["一個專屬於你、不用每天找的汽車停車位", { car: 3 }],
        ["一條連到市區、中間不會中斷的自行車道", { bike: 3 }],
        ["一個走路三分鐘就到的公車站或捷運站", { transit: 2, walk: 1 }],
        ["一座隨時借得到、也還得掉的共享運具站", { share: 3 }],
        ["一段平整、有樹蔭、不會被車擋住的人行道", { walk: 2, transit: 1 }],
        ["一條好進好出、不會塞住的巷子", { moto: 2, car: 1 }]
      ]
    },
    {
      q: "在路上移動的那段時間，你通常都在做什麼？",
      a: [
        ["手握方向盤或機車龍頭，得專心注意路況", { car: 1, moto: 2 }],
        ["在座位上放空、補眠，或用手機看影片", { transit: 2, car: 1 }],
        ["看看路邊的店家和路人，順便發呆", { walk: 2, bike: 1 }],
        ["感受風吹，感覺自己的身體正在出力", { bike: 2, walk: 1 }],
        ["心裡盤算等一下要在哪裡下車、轉哪一班車", { share: 2, transit: 1 }],
        ["戴上耳機聽 podcast，享受一個人的空間", { car: 2, transit: 1 }]
      ]
    },
    {
      q: "下面哪個通勤畫面最讓你受不了？",
      a: [
        ["站在公車站牌下，等的車一直不來", { moto: 2, car: 1 }],
        ["為了停汽車，繞了好幾圈找不到車位", { transit: 2, walk: 1 }],
        ["卡在一台接一台、完全不動的車陣裡", { bike: 2, moto: 1 }],
        ["尖峰時段在車廂裡被推擠、整路貼著陌生人", { car: 2, moto: 1 }],
        ["想借共享單車或共享機車時，附近一台都沒有", { share: 2, bike: 1 }],
        ["人行道被違停機車或攤位擋住，只能走到車道上", { walk: 3 }]
      ]
    },
    {
      q: "出門在外，下面哪一件事你最在意？",
      a: [
        ["冷氣夠不夠涼、座位舒不舒服", { car: 3 }],
        ["這趟到底要花多少時間，能不能更快一點", { moto: 2, bike: 1 }],
        ["這趟交通總共要花多少錢", { transit: 2, share: 1 }],
        ["想臨時改路線或改時間時，方不方便", { share: 2, moto: 1 }],
        ["一路上安不安全，會不會被太陽曬、被雨淋", { car: 1, transit: 1, walk: 1 }],
        ["沿途風景好不好看，有沒有店可以順路逛", { walk: 2, bike: 1 }]
      ]
    },
    {
      q: "如果你自己一個人住，你會想買一台屬於自己的車嗎？",
      a: [
        ["會，有一台自己的汽車，生活方便太多了", { car: 2, moto: 1 }],
        ["買一台機車就好，停車和油錢都省", { moto: 2, bike: 1 }],
        ["不會，需要開車時租一台共享汽車就好", { share: 3 }],
        ["不會，捷運公車就夠用，養一台車太麻煩", { transit: 2, walk: 1 }],
        ["不會，我平常走路、騎腳踏車就能滿足所有需求", { walk: 2, bike: 1 }]
      ]
    },
    {
      q: "週末多出半天空檔，下面哪個安排最像你？",
      a: [
        ["開汽車載朋友去郊外走走", { car: 2, transit: 1 }],
        ["騎腳踏車沿著河濱或市區繞一大圈", { bike: 2, walk: 1 }],
        ["搭火車或客運去鄰近城市晃一晃", { transit: 2, share: 1 }],
        ["騎機車往山上或海邊衝", { moto: 2, car: 1 }],
        ["在住家附近散步、逛逛店、喝杯咖啡", { walk: 3 }],
        ["臨時決定要去哪，也臨時決定要搭哪一種交通工具", { share: 2, moto: 1 }]
      ]
    },
    {
      q: "如果你的移動方式代表一種個性，你希望別人怎麼形容你？",
      a: [
        ["顧家、把舒適和安全放在第一位", { car: 3 }],
        ["有效率、最討厭浪費時間", { moto: 2, bike: 1 }],
        ["靈活、不喜歡被一台車綁住", { share: 2, bike: 1 }],
        ["從容、把整座城市當成自家後院", { walk: 2, transit: 1 }],
        ["規律、把每一段路都安排得剛剛好", { transit: 2, share: 1 }],
        ["有活力、喜歡靠自己的力氣移動", { bike: 2, walk: 1 }]
      ]
    }
  ];

  /* ---------------- state ---------------- */
  const stage = document.getElementById("stage");
  const roadFill = document.getElementById("roadFill");
  const progLabel = document.getElementById("progLabel");
  let step = -1;                 // -1 start, 0..8 questions, 9 result
  const answers = new Array(Q.length).fill(null);

  function setProgress() {
    let pct = 0, label = "START";
    if (step >= 0 && step < Q.length) {
      pct = (step / Q.length) * 100;
      label = String(step + 1).padStart(2, "0") + " / " + Q.length;
    } else if (step >= Q.length) {
      pct = 100; label = "結果";
    }
    roadFill.style.width = pct + "%";
    progLabel.textContent = label;
  }

  function badge(mode) {
    return '<span class="badge">' + GLYPH[mode] + '</span>';
  }

  /* ---------------- screens ---------------- */
  function renderStart() {
    step = -1;
    setProgress();
    const strip = ["walk", "bike", "transit", "share", "moto", "car"]
      .map(m => badge(m)).join("");
    stage.innerHTML = `
      <div class="view">
        <p class="eyebrow">社團聯展 · 互動測驗</p>
        <h1>你在路上，<br>是哪一種人？</h1>
        <p class="lede">同樣一段路，有人用走的、有人騎車、有人非開車不可。十二個生活情境，選出最像你的反應，一題一題加起來，看看你的「道路人格」是哪一款。</p>
        <div class="strip" aria-hidden="true">${strip}</div>
        <button class="btn" id="go">開始測驗 · 約 2 分鐘</button>
      </div>`;
    document.getElementById("go").onclick = () => goto(0);
  }

  function renderQuestion() {
    setProgress();
    const item = Q[step];
    const chosen = answers[step];
    stage.innerHTML = `
      <div class="view">
        <div class="qhead"><span class="qcount">Q${step + 1}</span></div>
        <p class="qtext">${item.q}</p>
        <div class="opts">
          ${item.a.map((opt, i) =>
            `<button class="opt${chosen === i ? " pick" : ""}" data-i="${i}"><span>${opt[0]}</span></button>`
          ).join("")}
        </div>
        <div class="qnav">
          <button class="back" id="back"${step === 0 ? " hidden" : ""}>← 上一題</button>
          <span class="qcount">${String(step + 1).padStart(2, "0")} / ${Q.length}</span>
        </div>
      </div>`;

    stage.querySelectorAll(".opt").forEach(btn => {
      btn.onclick = () => {
        answers[step] = Number(btn.dataset.i);
        btn.classList.add("pick");
        window.setTimeout(() => goto(step + 1), 170);
      };
    });
    const back = document.getElementById("back");
    if (back) back.onclick = () => goto(step - 1);
  }

  function score() {
    const s = { walk: 0, bike: 0, share: 0, moto: 0, car: 0, transit: 0 };
    answers.forEach((ai, qi) => {
      if (ai == null) return;
      const w = Q[qi].a[ai][1];
      for (const k in w) s[k] += w[k];
    });
    const max = Math.max(...Object.values(s));
    const winner = PRIORITY.find(k => s[k] === max);
    return { winner, s, max };
  }

  function renderResult() {
    step = Q.length;
    setProgress();
    const { winner } = score();
    const p = P[winner];
    const mt = P[p.match], cl = P[p.clash];

    const studs = Array.from({ length: 5 }, (_, i) =>
      `<span class="stud${i < p.idx ? " on" : ""}"></span>`).join("");

    stage.innerHTML = `
      <div class="view">
        <div class="plate" style="--hue: var(--hue-${winner})">
          <p class="eyebrow">你的道路人格</p>
          ${badge(winner)}
          <h2 class="rname">${p.name}<br><span style="font-size:.62em;color:var(--ink-soft)">「${p.tab}」</span></h2>
          <span class="nick">${p.nick}</span>
          <p class="motto">${p.motto}</p>
          <p class="desc">${p.desc}</p>

          <hr class="rule" />
          <p class="shadow-lbl">隱藏性格</p>
          <p class="shadow-txt">${p.shadow}</p>

          <p class="idx-lbl">人本交通指數</p>
          <div class="studs">${studs}<span>${p.idx} / 5</span></div>

          <div class="pair">
            <div class="match"><span class="k">路上最速配</span><span class="v">${mt.name}</span></div>
            <div class="clash"><span class="k">路上絕緣體</span><span class="v">${cl.name}</span></div>
          </div>
        </div>

        <div class="cta">
          <div class="where">社團聯展 · 攤位見</div>
          <p>喜歡走路、騎車、搭車的城市，是設計出來的。來攤位跟我們聊聊你家那條路可以怎麼變好——或吐槽也可以。</p>
          <div class="qr">把這格換成你們的<br>QR Code / IG 連結</div>
        </div>

        <div class="actions">
          <button class="btn" id="copy">複製結果文字</button>
          <button class="btn ghost" id="again">再測一次</button>
        </div>
        <p class="toast" id="toast"></p>
      </div>`;

    document.getElementById("again").onclick = () => {
      answers.fill(null);
      goto(-1);
    };
    document.getElementById("copy").onclick = () => {
      const text =
        `我的道路人格是「${p.name}・${p.tab}」— ${p.nick}\n` +
        `${p.motto}\n` +
        `路上最速配：${mt.name}／絕緣體：${cl.name}\n` +
        `來社團聯展攤位測測看你是哪種？`;
      navigator.clipboard?.writeText(text).then(
        () => flash("已複製，去貼上分享吧！"),
        () => flash("複製失敗，長按選取上面文字吧")
      );
    };
  }

  function flash(msg) {
    const t = document.getElementById("toast");
    if (t) t.textContent = msg;
  }

  /* ---------------- router ---------------- */
  function goto(n) {
    step = n;
    window.scrollTo({ top: 0, behavior: "auto" });
    if (n < 0) renderStart();
    else if (n < Q.length) renderQuestion();
    else renderResult();
  }

  renderStart();
</script>
</body>
</html>
